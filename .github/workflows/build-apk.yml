name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create signing properties
        run: |
          cat > keystore.properties << 'EOF'
          storeFile=my-upload-key.jks
          storePassword=Chess3dUpload2026!
          keyAlias=chess3d
          keyPassword=Chess3dUpload2026!
          EOF

      - name: Build signed release APK and AAB
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Prepare download files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Chess3DArena-1.0.0.apk
          cp app/build/outputs/bundle/release/*.aab dist/Chess3DArena-1.0.0.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chess3DArena-APK
          path: dist/Chess3DArena-1.0.0.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Chess3DArena-AAB
          path: dist/Chess3DArena-1.0.0.aab
          if-no-files-found: error
